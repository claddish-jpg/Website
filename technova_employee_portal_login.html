<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 1. Document Title Requirement -->
    <title>TechNova Solutions - Employee Portal Login</title>

    <!-- 3. Internal Stylesheet with CSS Comments -->
    <style>
        /* Base page styling applying light tint for background and setting base typography */
        body {
            background-color: #f0f4f8;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 40px 0;
        }

        /* Table container styling: medium tone borders and solid backdrop */
        table {
            background-color: #ffffff;
            border: 2px solid #4a6fa5;
            border-spacing: 0;
            border-collapse: collapse;
            width: 360px;
        }

        /* Table header section: dark shade background and header title styling */
        thead {
            background-color: #1a365d;
        }

        h2 {
            color: #ffffff;
            margin: 0;
            padding: 16px;
            font-size: 20px;
            text-align: center;
        }

        /* Table body cell styling: spacing and text labels */
        tbody td {
            padding: 12px 16px;
            color: #1a365d;
            font-weight: bold;
            font-size: 14px;
        }

        /* Input field styling: light backdrop with medium tone border outlines */
        input {
            width: 90%;
            padding: 8px 10px;
            border: 1px solid #4a6fa5;
            border-radius: 3px;
            background-color: #f8fafc;
            color: #1a365d;
        }

        /* Table footer section: layout and padding for action buttons and metadata */
        tfoot td {
            padding: 12px;
            text-align: center;
        }

        /* Primary action button styling: dark shade fill with clear contrast */
        input[type="submit"] {
            background-color: #1a365d;
            color: #ffffff;
            border: 1px solid #1a365d;
            padding: 8px 18px;
            cursor: pointer;
            font-weight: bold;
            width: auto;
        }

        /* Secondary action button styling: medium tone fill for distinction */
        input[type="reset"] {
            background-color: #4a6fa5;
            color: #ffffff;
            border: 1px solid #4a6fa5;
            padding: 8px 18px;
            cursor: pointer;
            font-weight: bold;
            width: auto;
        }
    </style>
</head>
<body>

    <!-- Main Structural Block: Login Form -->
    <form>
        <!-- Centered Table Layout Structure -->
        <table align="center">

            <!-- Table Header Section -->
            <thead>
                <tr>
                    <th colspan="2">
                        <h2>Portal Login</h2>
                    </th>
                </tr>
            </thead>

            <!-- Table Body Section (Inputs) -->
            <tbody>
                <tr>
                    <td>
                        <label for="username">Username:</label>
                    </td>
                    <td>
                        <input type="text" id="username" placeholder="Enter Username">
                    </td>
                </tr>
                <tr>
                    <td>
                        <label for="password">Password:</label>
                    </td>
                    <td>
                        <input type="password" id="password" placeholder="Enter Password">
                    </td>
                </tr>
            </tbody>

            <!-- Table Footer Section (Buttons & Student Metadata) -->
            <tfoot>
                <tr>
                    <td colspan="2">
                        <input type="submit" value="Submit">
                        <input type="reset" value="Reset">
                    </td>
                </tr>
                <tr>
                    <td colspan="2" style="font-weight: normal; font-size: 12px; color: #4a6fa5; padding-top: 15px;">
                        Created by: [Your Full Name] - [Year] & [Section]
                    </td>
                </tr>
            </tfoot>

        </table>
    </form>

</body>
</html>
