<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Inputs</title>
</head>
<body>

    <h1 align="center">Text Input Elements</h1>

    <form action="#" method="post">
        <table border="1" width="70%" align="center">
            <thead>
                <tr>
                    <th>Form Element</th>
                    <th>Sample Output</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Basic Text</td>
                    <td><input type="text" id="basic-text" name="basic_text" placeholder="Enter plain text" maxlength="50"></td>
                </tr>
                <tr>
                    <td>Password</td>
                    <td><input type="password" id="user-password" name="user_password" placeholder="Enter password" required></td>
                </tr>
                <tr>
                    <td>Email</td>
                    <td><input type="email" id="user-email" name="user_email" placeholder="user@example.com" multiple></td>
                </tr>
                <tr>
                    <td>URL</td>
                    <td><input type="url" id="user-url" name="user_url" placeholder="https://example.com"></td>
                </tr>
                <tr>
                    <td>Telephone</td>
                    <td><input type="tel" id="user-tel" name="user_tel" placeholder="123-456-7890" pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}"></td>
                </tr>
                <tr>
                    <td>Search</td>
                    <td><input type="search" id="site-search" name="site_search" placeholder="Search site..."></td>
                </tr>
            </tbody>
        </table>
    </form>

</body>
</html>
