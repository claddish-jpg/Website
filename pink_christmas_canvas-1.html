<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Merry Christmas</title>
  <style>
    body {
      margin: 0;
      background: #fff7fa;
      font-family: Arial, sans-serif;
      text-align: center;
      color: #63384d;
    }
    .home {
      display: block;
      padding: 14px 0;
      color: #a84f78;
      font-size: 14px;
    }
    .tree-area {
      height: 470px;
      border-top: 1px solid #d99ab6;
      border-bottom: 1px solid #d99ab6;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding-top: 18px;
      box-sizing: border-box;
    }
    canvas {
      width: 250px;
      height: 330px;
    }
    h1 {
      margin-top: 46px;
      font-size: 30px;
      font-weight: normal;
      color: #a84f78;
    }
  </style>
</head>
<body>
  <a class="home" href="#">Home</a>

  <div class="tree-area">
    <canvas id="tree" width="250" height="330"></canvas>
  </div>

  <h1>Merry Christmas!</h1>

  <script>
    const canvas = document.getElementById("tree");
    const ctx = canvas.getContext("2d");

    // Tree trunk
    ctx.fillStyle = "#b98591";
    ctx.fillRect(88, 245, 74, 48);
    ctx.strokeStyle = "#63384d";
    ctx.lineWidth = 2;
    ctx.strokeRect(88, 245, 74, 48);

    // Two simple pink tree layers
    ctx.beginPath();
    ctx.moveTo(125, 28);
    ctx.lineTo(31, 151);
    ctx.lineTo(219, 151);
    ctx.closePath();
    ctx.fillStyle = "#e88db3";
    ctx.fill();
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(125, 112);
    ctx.lineTo(31, 245);
    ctx.lineTo(219, 245);
    ctx.closePath();
    ctx.fillStyle = "#d978a5";
    ctx.fill();
    ctx.stroke();

    // Star
    function drawStar(cx, cy, outer, inner) {
      ctx.beginPath();
      for (let i = 0; i < 10; i++) {
        const angle = -Math.PI / 2 + i * Math.PI / 5;
        const radius = i % 2 === 0 ? outer : inner;
        const x = cx + Math.cos(angle) * radius;
        const y = cy + Math.sin(angle) * radius;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.closePath();
      ctx.fillStyle = "#ffd5e5";
      ctx.fill();
      ctx.stroke();
    }
    drawStar(125, 22, 24, 11);

    // Round ornaments
    function ornament(x, y, color) {
      ctx.beginPath();
      ctx.arc(x, y, 9, 0, Math.PI * 2);
      ctx.fillStyle = color;
      ctx.fill();
      ctx.stroke();
    }
    ornament(125, 91, "#f7c6d9");
    ornament(97, 130, "#f4b2cb");
    ornament(153, 130, "#c9a8dc");
    ornament(78, 207, "#f7c6d9");
    ornament(125, 188, "#c9a8dc");
    ornament(172, 207, "#f4b2cb");
  </script>
</body>
</html>
